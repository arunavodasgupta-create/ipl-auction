<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPL Auction Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ---- Broadcast scoreboard layout: top rail, teams | lot stage | wishlist/sets, night-stadium palette ---- */
:root {
  --night: #070b18; --deep: #0c1330; --panel: #111a3b; --panel2: #172250; --line: #26335f;
  --text: #eef2ff; --mute: #98a4cf; --gold: #f4b73f; --gold-ink: #251800; --live: #ff5a5f; --ok: #34d399; --warn: #fbbf24;
  --tc: #3b4a8f;
  --f-disp: 'Big Shoulders Display', 'Oswald', 'Arial Narrow', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --f-num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  color-scheme: dark;
}
html, body { height: auto; }
body {
  margin: 0; color: var(--text); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  background: radial-gradient(900px 420px at 50% -80px, #1d2d70 0%, transparent 70%), radial-gradient(500px 300px at 100% 0, #3a1f5f55 0%, transparent 70%), var(--night);
  background-attachment: fixed;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-disp); font-weight: 800; letter-spacing: .02em; margin: 0; text-wrap: balance; text-transform: uppercase; }
h2 { font-size: 24px; } h3 { font-size: 18px; }
small, .mute { color: var(--mute); }
.shell { max-width: 1500px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 6px 14px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-disp); font-weight: 900; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; }
.brand i { width: 14px; height: 30px; background: var(--gold); border-radius: 3px; box-shadow: 18px 0 0 -2px var(--gold), 36px 0 0 -2px var(--gold); margin-right: 34px; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--f-num); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.crumbs span { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); }
.crumbs span.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.crumbs span.past { color: var(--text); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: 9px 14px; font-weight: 600; transition: transform .1s, background .15s; }
.btn:hover:not(:disabled) { background: #1f2d66; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-family: var(--f-disp); font-size: 20px; letter-spacing: .05em; text-transform: uppercase; font-weight: 800; padding: 10px 22px; }
.btn.gold:hover:not(:disabled) { background: #ffc85a; }
.btn.mini { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.on { background: var(--ok); border-color: var(--ok); color: #03281b; }
.btn.danger { border-color: #6b2a35; color: #ffb3b8; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: #1d2859; color: #cfd7ff; margin: 0 4px 4px 0; }
.tag.os { background: #3b2a66; color: #e3d4ff; } .tag.cap { background: #14423a; color: #9bf0d0; } .tag.unc { background: #4a3a14; color: #ffe19b; } .tag.hot { background: var(--gold); color: var(--gold-ink); }
.crest { display: block; flex: none; }
input[type=text], input[type=search], input[type=number], select { background: #0a1128; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-width: 0; }
input.num { width: 84px; text-align: right; font-family: var(--f-num); font-weight: 700; font-size: 16px; padding: 5px 8px; }

/* home */
.hero { padding-block: 10px 6px; max-width: 760px; }
.hero h1 { font-size: clamp(40px, 7vw, 76px); line-height: .95; }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero p { color: var(--mute); font-size: 17px; margin: 10px 0 0; }
.rulestrip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.rulestrip span { font-family: var(--f-num); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 14px; }
.sec { margin-top: 26px; display: grid; gap: 12px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.mode { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.mode[aria-pressed=true] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset, 0 8px 30px #f4b73f22; background: var(--panel2); }
.mode b { font-family: var(--f-disp); font-size: 24px; text-transform: uppercase; letter-spacing: .03em; }
.mode .k { font-family: var(--f-num); color: var(--gold); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.mode p { margin: 0; color: var(--mute); }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.teamtile { display: grid; justify-items: center; gap: 6px; padding: 14px 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); text-align: center; }
.teamtile[aria-pressed=true] { border-color: var(--tc); box-shadow: 0 0 0 2px var(--tc) inset, 0 10px 30px color-mix(in srgb, var(--tc) 35%, transparent); background: var(--panel2); }
.teamtile b { font-size: 13px; line-height: 1.15; }
.cta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }

/* lists */
.two { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
.sticky { position: sticky; top: env(safe-area-inset-top, 0px); }
.plist { display: grid; gap: 4px; max-height: 68vh; overflow-y: auto; padding-right: 4px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: #0d1532; border: 1px solid transparent; }
.prow.sel { border-color: var(--ok); background: #0e2a2e; }
.prow.cur { border-color: var(--gold); background: #2a2210; }
.prow .pi { flex: 1; min-width: 0; display: grid; }
.prow .pi b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pi small { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .pr { display: flex; align-items: center; gap: 6px; flex: none; font-family: var(--f-num); font-weight: 700; font-size: 15px; }
.av { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(145deg, #2b3a82, #141d46); font-family: var(--f-disp); font-weight: 800; font-size: 14px; letter-spacing: .04em; border: 1px solid var(--line); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-block: 10px; }
.filters input[type=search] { flex: 1; min-width: 160px; }
details.set { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--deep); }
details.set > summary { padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; font-family: var(--f-disp); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; font-size: 17px; list-style-position: inside; }
details.set > summary small { margin-left: auto; font-family: var(--f-num); font-size: 14px; letter-spacing: .04em; }
details.set > div { display: grid; gap: 4px; padding: 0 8px 8px; }
.stat { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-num); font-weight: 600; font-size: 16px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.msg { padding: 8px 10px; border-radius: 9px; background: #2a1d10; border: 1px solid #5c4318; color: #ffd9a0; font-size: 14px; }
.msg.ok { background: #0f2a22; border-color: #1e5a46; color: #a7f0cf; }
.empty { padding: 18px 8px; text-align: center; color: var(--mute); }

/* reveal */
.reveal { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.rcard { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--tc); border-radius: 12px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.rcard.me { box-shadow: 0 0 0 2px var(--gold) inset; }
.rcard ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; }
.rcard li { display: flex; justify-content: space-between; gap: 8px; }

/* auction */
.hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
.hud .live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-num); font-weight: 700; letter-spacing: .12em; color: var(--live); }
.hud .live::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--live); animation: pulse 1.4s infinite; }
.hud.paused .live { color: var(--warn); } .hud.paused .live::before { background: var(--warn); animation: none; }
.hud select { padding: 6px 8px; max-width: 190px; }
.hud label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.arena { display: grid; grid-template-columns: 270px minmax(0, 1fr) 350px; gap: 12px; align-items: start; }
.stage { position: relative; display: grid; gap: 12px; }
.lotbar { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--f-num); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.lotbar b { color: var(--gold); }
.lot { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: center; }
.photo { border-radius: 14px; background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--tc) 55%, #101a44), #0a1030 75%); border: 1px solid var(--line); overflow: hidden; aspect-ratio: 170 / 200; position: relative; }
.photo svg, .photo img { width: 100%; height: 100%; display: block; object-fit: cover; }
.photo .ini { position: absolute; left: 8px; bottom: 6px; font-family: var(--f-disp); font-weight: 900; font-size: 22px; letter-spacing: .05em; opacity: .9; text-shadow: 0 2px 8px #000; }
.meta h2 { font-size: clamp(30px, 4.6vw, 52px); line-height: .95; overflow-wrap: anywhere; }
.facts { margin-top: 6px; color: var(--mute); }
.facts b { color: var(--text); font-family: var(--f-num); font-size: 18px; }
.bars { display: grid; gap: 5px; margin-top: 10px; max-width: 420px; }
.bar { display: grid; grid-template-columns: 70px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 13px; color: var(--mute); }
.bar i { height: 7px; border-radius: 4px; background: #1a2554; overflow: hidden; display: block; }
.bar i b { display: block; height: 100%; background: linear-gradient(90deg, var(--tc), var(--gold)); }
.bar span:last-child { font-family: var(--f-num); font-weight: 700; color: var(--text); text-align: right; }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 230px); gap: 12px; }
.led { background: #03060f; border: 2px solid #2a3560; border-radius: 14px; padding: 12px 16px; box-shadow: inset 0 0 50px #f4b73f12; background-image: radial-gradient(#ffffff0a 1px, transparent 1px); background-size: 6px 6px; }
.led small { font-family: var(--f-num); letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
.price { font-family: var(--f-disp); font-weight: 900; font-size: clamp(54px, 9vw, 100px); line-height: 1; color: var(--gold); text-shadow: 0 0 28px #f4b73f66; font-variant-numeric: tabular-nums; }
.price.bump { animation: bump .28s ease-out; }
.sayline { min-height: 24px; font-family: var(--f-num); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--live); }
.leader { border-radius: 14px; border: 1px solid var(--line); border-left: 6px solid var(--tc); background: var(--panel2); padding: 12px; display: grid; gap: 6px; justify-items: start; align-content: center; }
.leader b { font-family: var(--f-disp); font-size: 22px; text-transform: uppercase; line-height: 1; }
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.actions .btn.gold { min-width: 230px; font-size: 26px; padding: 14px 24px; }
.blog { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; min-height: 120px; }
.blog li { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 9px; background: #0d1532; font-family: var(--f-num); font-weight: 600; font-size: 17px; }
.blog li:first-child { background: #2a2210; border: 1px solid #6b5316; }
.blog li span:last-child { margin-left: auto; color: var(--gold); font-weight: 700; }
.stamp { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; }
.stamp div { transform: rotate(-8deg); border: 8px solid var(--tc); color: var(--tc); background: #070b18e6; padding: 8px 28px; border-radius: 10px; font-family: var(--f-disp); font-weight: 900; font-size: clamp(44px, 9vw, 96px); letter-spacing: .06em; text-transform: uppercase; text-align: center; line-height: 1; animation: slam .35s cubic-bezier(.2, 1.6, .4, 1); }
.stamp small { display: block; font-family: var(--f-num); font-size: clamp(16px, 2.4vw, 26px); letter-spacing: .08em; color: var(--text); margin-top: 6px; }
.pausedmask { position: absolute; inset: 0; z-index: 4; background: #070b18cc; display: grid; place-items: center; border-radius: 14px; font-family: var(--f-disp); font-weight: 900; font-size: 56px; letter-spacing: .1em; color: var(--warn); }
.col { display: grid; gap: 10px; min-width: 0; }
.trow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--tc); text-align: left; width: 100%; }
.trow.me { box-shadow: 0 0 0 1px var(--gold) inset; }
.trow.lead { background: color-mix(in srgb, var(--tc) 28%, var(--panel)); animation: glow 1s ease-out; }
.trow b { font-family: var(--f-disp); font-size: 18px; letter-spacing: .03em; }
.trow small { display: block; font-family: var(--f-num); font-weight: 600; font-size: 13.5px; letter-spacing: .02em; }
.trow .pur { font-family: var(--f-num); font-weight: 800; font-size: 20px; text-align: right; color: var(--gold); }
.trow .pur small { color: var(--mute); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { flex: 1; padding: 7px 6px; border-radius: 9px; border: 1px solid var(--line); background: transparent; font-family: var(--f-num); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 14px; }
.tabs button[aria-selected=true] { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.sidebody { max-height: 74vh; overflow-y: auto; padding-right: 4px; margin-top: 10px; }
.only-m { display: none !important; }
.wrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; background: #0d1532; margin-bottom: 4px; }
.wrow.cur { border: 1px solid var(--gold); background: #2a2210; }
.wrow .pi { display: grid; min-width: 0; } .wrow .pi b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .wrow .pi small { font-size: 12px; }
.modal { position: fixed; inset: 0; z-index: 50; background: #03050dd9; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal > div { width: min(560px, 100%); max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--gold); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.modal.wide > div { width: min(760px, 100%); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--gold); color: var(--gold-ink); font-weight: 700; padding: 10px 18px; border-radius: 999px; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px #0008; }
.stepper { display: flex; gap: 10px; align-items: center; justify-content: center; }
.stepper .big { font-family: var(--f-disp); font-weight: 900; font-size: 48px; color: var(--gold); min-width: 160px; text-align: center; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tbl th, table.tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tbl th { font-family: var(--f-num); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-size: 12.5px; }
.scroll-x { overflow-x: auto; }
.note { font-size: 13px; color: var(--mute); margin-top: 18px; max-width: 900px; }

@keyframes pulse { 50% { opacity: .35; } }
@keyframes bump { 0% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes slam { 0% { transform: rotate(-8deg) scale(2.2); opacity: 0; } 100% { transform: rotate(-8deg) scale(1); opacity: 1; } }
@keyframes glow { 0% { box-shadow: 0 0 0 3px var(--tc); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (max-width: 1180px) {
  .arena { grid-template-columns: minmax(0, 1fr) 330px; }
  .teams-col { display: none; }
  .only-m { display: inline-block !important; }
}
@media (max-width: 860px) {
  .arena, .two { grid-template-columns: minmax(0, 1fr); }
  .sticky { position: static; }
  .board { grid-template-columns: minmax(0, 1fr); }
  .lot { grid-template-columns: 110px minmax(0, 1fr); gap: 12px; }
  .actions .btn.gold { min-width: 0; flex: 1; }
  .plist { max-height: 56vh; }
}

[hidden] { display: none !important; }
.cw { display: inline-block; position: relative; flex: none; }
.cw svg, .cw img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.photo img { position: absolute; inset: 0; }
.rs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.rs span { background: #0d1532; border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; font-family: var(--f-num); font-weight: 600; font-size: 14px; color: var(--mute); }
.rs b { color: var(--gold); margin-left: 4px; }

<div class="shell" id="app">
  <header class="top"><div class="brand"><i></i>IPL Auction Arena</div><nav class="crumbs" id="crumbs" aria-label="Progress"></nav></header>
  <main id="screen"></main>
  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="stats.js"></script>
<script>
/* ===== DATA ===== */
/* Team crests are drawn in code (official logos can't be loaded inside an artifact).
   To use real images on your own hosting, fill ASSETS.logo[teamId] / ASSETS.photo[playerId] with URLs or data: URIs. */
const ASSETS = { logo: {}, photo: {} };

const TEAMS = [
  { id: 'CSK',  name: 'Chennai Super Kings',          c1: '#f2c500', ring: '#0b3a8c', ink: '#0b3a8c' },
  { id: 'MI',   name: 'Mumbai Indians',              c1: '#0b5ea8', ring: '#d1ab3e', ink: '#ffffff' },
  { id: 'RCB',  name: 'Royal Challengers Bengaluru', c1: '#b3121f', ring: '#e8c25a', ink: '#f6dc8a' },
  { id: 'KKR',  name: 'Kolkata Knight Riders',       c1: '#3b2063', ring: '#f0c24b', ink: '#f0c24b' },
  { id: 'DC',   name: 'Delhi Capitals',              c1: '#17479e', ring: '#ef1b23', ink: '#ffffff' },
  { id: 'GT',   name: 'Gujarat Titans',              c1: '#1c2b4a', ring: '#d9c08a', ink: '#d9c08a' },
  { id: 'LSG',  name: 'Lucknow Super Giants',        c1: '#0a8fd1', ring: '#f58220', ink: '#ffffff' },
  { id: 'PBKS', name: 'Punjab Kings',                c1: '#d3202a', ring: '#dcdddf', ink: '#ffffff' },
  { id: 'RR',   name: 'Rajasthan Royals',            c1: '#e91e8c', ring: '#1f3fa0', ink: '#ffffff' },
  { id: 'SRH',  name: 'Sunrisers Hyderabad',         c1: '#f26a21', ring: '#151515', ink: '#151515' },

/* name | role | nationality | capped(1/0) | base price (lakh) | 2025 team | 2025 price (crore) | rating (0-100, my estimate) | 2024 team (RTM / retention roster) | R = actually retained for 2025 */
const RAW = `
Ruturaj Gaikwad|BA|IN|1|200|CSK|18|88|CSK|R
Matheesha Pathirana|FA|SL|1|150|CSK|13|84|CSK|R
Shivam Dube|AR|IN|1|150|CSK|12|82|CSK|R
Ravindra Jadeja|AR|IN|1|200|CSK|18|88|CSK|R
MS Dhoni|WK|IN|0|50|CSK|4|78|CSK|R
Jasprit Bumrah|FA|IN|1|200|MI|18|95|MI|R

const PLAYERS = RAW.trim().split('\n').map((l, i) => {
  const [name, role, nat, cap, base, team, price, ovr, prev, ret] = l.split('|');
  return {
    id: i, name, role, nat, os: nat !== 'IN', capped: cap === '1', base: +base,

/* ===== ENGINE (no DOM access) ===== */
const MIN_SQ = 19, MAX_SQ = 25, MAX_OS = 8, PURSE = 13000, MIN_BASE = 30; // money is stored in lakh
const SLABS = [1800, 1400, 1100, 1800, 1400], UNC_SLAB = 400;
const TM = Object.fromEntries(TEAMS.map(t => [t.id, t]));
const ROLE_NAME = { BA: 'Batter', AR: 'All-rounder', WK: 'Wicketkeeper', FA: 'Fast bowler', SP: 'Spinner' };
const TARGET = { BA: 5, AR: 4, WK: 3, FA: 6, SP: 3 };

const rnd = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inc = l => l < 100 ? 5 : l < 200 ? 10 : l < 500 ? 20 : 25;
const fmt = l => { if (l >= 100) { const c = l / 100; return '₹' + (Number.isInteger(c) ? c : +c.toFixed(2)) + ' Cr'; } return '₹' + l + ' L'; };
const say = l => { const c = Math.floor(l / 100), k = l % 100; return [c ? c + ' crore' : '', k ? k + ' lakh' : ''].filter(Boolean).join(' ') + ' rupees'; };
const fairPrice = o => Math.min(3000, Math.max(30, Math.round(30 * Math.exp((o - 55) * 0.12) / 5) * 5));
const chunk = (arr, size) => { if (!arr.length) return []; const n = Math.ceil(arr.length / size), s = Math.ceil(arr.length / n); const out = []; for (let i = 0; i < arr.length; i += s) out.push(arr.slice(i, i + s)); return out; };

/* ---------- squad helpers ---------- */
function info(G, t) {
  const T = G.teams[t], roles = { BA: 0, AR: 0, WK: 0, FA: 0, SP: 0 }; let os = 0;
  for (const e of T.squad) { const p = G.players[e.pid]; roles[p.role]++; if (p.os) os++; }
  const n = T.squad.length;
  return { n, os, roles, ind: n - os, purse: T.purse, indLeft: MAX_SQ - n, osLeft: Math.max(0, Math.min(MAX_OS - os, MAX_SQ - n)) };
}
const reserveFor = n => Math.max(0, MIN_SQ - (n + 1)) * MIN_BASE;
function maxAfford(G, t) { const T = G.teams[t]; return T.purse - reserveFor(T.squad.length); }
function whyNot(G, t, p, price) {
  const I = info(G, t);
  if (I.n >= MAX_SQ) return 'Squad is full (25)';
  if (p.os && I.os >= MAX_OS) return 'Overseas limit reached (8)';
  if (price > maxAfford(G, t)) return 'Not enough purse (must keep ₹30 L per slot to reach 19 players)';
  return null;
}
const canBid = (G, t, p, price) => !whyNot(G, t, p, price);
const nextPrice = (c, p) => c.leader ? c.price + inc(c.price) : p.base;

/* ---------- AI valuation ---------- */
function maxBid(G, t, p) {
  const T = G.teams[t], I = info(G, t);
  let v = fairPrice(p.ovr) * G.scale;
  const need = TARGET[p.role] - I.roles[p.role];
  v *= need >= 2 ? 1.22 : need === 1 ? 1.1 : need === 0 ? 0.95 : 0.6;
  if (I.n < 14) v *= 1.1;
  if (I.n >= 21) v *= 0.45;
  if (p.os && I.os >= 7) v *= 0.6;
  v *= T.aggr * rnd(0.75, 1.4);
  if (p.ovr >= 88) v *= 1.06;
  if (G.accel) v *= 0.8;
  v = Math.min(v, maxAfford(G, t), Math.max(T.purse * 0.4, 500));
  return Math.max(0, Math.floor(v / 5) * 5);
}

/* ---------- game setup ---------- */
function newGame(mode, user, customPicks) {
  const G = {
    mode, user, players: PLAYERS.map(p => ({ ...p, owner: null, soldPrice: 0, rtmTeam: null })),
    rosters: {}, teams: {}, pool: [], sets: [], unsold: [], sold: [], filled: [], log: [], interest: {},
    scale: 0.8, wishlist: {}, auto: true, accel: false, stage: 'retention', cur: null, lotNo: 0, totalLots: 0, reveal: {},
  };
  TEAMS.forEach(t => { G.teams[t.id] = { id: t.id, purse: PURSE, squad: [], rtm: 0, aggr: rnd(0.9, 1.18), retained: [] }; G.rosters[t.id] = []; });
  if (mode === 'real') {
    G.players.forEach(p => { if (p.prev) G.rosters[p.prev].push(p.id); });
  } else if (mode === 'mini') {
    G.players.forEach(p => { if (p.team25) G.rosters[p.team25].push(p.id); });
    for (const t of TEAMS) {
      let r = G.rosters[t.id];
      const osOf = () => r.filter(id => G.players[id].os);
      while (osOf().length > MAX_OS) { const worst = osOf().sort((a, b) => G.players[a].ovr - G.players[b].ovr)[0]; r = r.filter(id => id !== worst); }
      while (r.length > MAX_SQ) { const worst = [...r].sort((a, b) => G.players[a].ovr - G.players[b].ovr)[0]; r = r.filter(id => id !== worst); }
      G.rosters[t.id] = r;
    }
  } else {
    G.rosters[user] = [...customPicks];
    const taken = new Set(customPicks);
    const others = TEAMS.map(t => t.id).filter(id => id !== user);
    for (let round = 0; round < 14; round++) {
      for (const id of shuffle([...others])) {
        const avail = G.players.filter(p => !taken.has(p.id) && !(p.os && G.rosters[id].filter(x => G.players[x].os).length >= MAX_OS))
          .sort((a, b) => b.ovr - a.ovr).slice(0, 14);
        if (!avail.length) continue;
        const p = avail[Math.floor(Math.random() * avail.length)];
        taken.add(p.id); G.rosters[id].push(p.id);
      }
    }
  }
  return G;
}

const slabCosts = (G, pids) => { let ci = 0; return pids.map(pid => G.players[pid].capped ? (SLABS[ci++] ?? 1100) : UNC_SLAB); };

function validateRetention(G, pids) {
  const ps = pids.map(id => G.players[id]);
  if (G.mode === 'mini') {
    const os = ps.filter(p => p.os).length, cost = ps.reduce((s, p) => s + p.price25, 0);
    if (ps.length > MAX_SQ) return { ok: false, msg: 'Maximum 25 players', cost };
    if (os > MAX_OS) return { ok: false, msg: 'Maximum 8 overseas players', cost };
    if (cost > PURSE) return { ok: false, msg: 'Contracts exceed the ₹130 Cr purse', cost };
    return { ok: true, cost, costs: ps.map(p => p.price25), rtm: 0 };
  }
  const cap = ps.filter(p => p.capped).length, unc = ps.length - cap;
  const costs = slabCosts(G, pids), cost = costs.reduce((a, b) => a + b, 0);
  if (ps.length > 6) return { ok: false, msg: 'Maximum 6 retentions', cost, costs };
  if (cap > 5) return { ok: false, msg: 'Maximum 5 capped players', cost, costs };
  if (unc > 2) return { ok: false, msg: 'Maximum 2 uncapped players', cost, costs };
  return { ok: true, cost, costs, rtm: 6 - ps.length };
}

function aiRetainPicks(G, roster) {
  const sorted = [...roster].sort((a, b) => G.players[b].ovr - G.players[a].ovr);
  const out = []; let cap = 0, unc = 0;
  for (const pid of sorted) {
    const p = G.players[pid];
    if (out.length >= 6) break;
    if (p.ovr < 76) continue;
    if (p.capped) { if (cap >= 5) continue; cap++; } else { if (unc >= 2) continue; unc++; }
    out.push(pid);
  }
  return out;
}

function aiMiniKeep(G, roster) {
  const ps = roster.map(id => G.players[id]);
  let keep = ps.filter(p => p.ovr >= 80 || (p.ovr >= 68 && p.price25 <= fairPrice(p.ovr) * 1.8 + 50));
  const rest = ps.filter(p => !keep.includes(p)).sort((a, b) => b.ovr - a.ovr);
  while (keep.length < 12 && rest.length) keep.push(rest.shift());
  const sum = () => keep.reduce((s, p) => s + p.price25, 0);
  while (sum() > 11800 && keep.length > 10) {
    keep.sort((a, b) => (b.price25 / fairPrice(b.ovr)) - (a.price25 / fairPrice(a.ovr)));
    keep.shift();
  }
  return keep.map(p => ({ pid: p.id, cost: p.price25 }));
}

function finalizeRetention(G, userPids) {
  const retained = new Set();
  for (const t of TEAMS) {
    const id = t.id, roster = G.rosters[id];
    let list;
    if (id === G.user) {
      const v = validateRetention(G, userPids);
      list = userPids.map((pid, i) => ({ pid, cost: v.costs[i] }));
    } else if (G.mode === 'real') {
      list = roster.filter(pid => G.players[pid].ret).map(pid => ({ pid, cost: G.players[pid].price25 }));
    } else if (G.mode === 'custom') {
      const picks = aiRetainPicks(G, roster), costs = slabCosts(G, picks);
      list = picks.map((pid, i) => ({ pid, cost: costs[i] }));
    } else list = aiMiniKeep(G, roster);
    const T = G.teams[id];
    T.purse = PURSE - list.reduce((s, e) => s + e.cost, 0);
    T.rtm = G.mode === 'mini' ? 0 : Math.max(0, 6 - list.length);
    list.forEach(e => { T.squad.push({ pid: e.pid, price: e.cost, how: 'RET' }); G.players[e.pid].owner = id; retained.add(e.pid); });
    G.reveal[id] = list.map(e => ({ ...e }));
  }
  G.pool = G.players.filter(p => !retained.has(p.id)).map(p => p.id);
  for (const t of TEAMS) for (const pid of G.rosters[t.id]) {
    if (!retained.has(pid) && G.mode !== 'mini') G.players[pid].rtmTeam = t.id;
  }
  G.sets = buildSets(G);
  G.totalLots = G.sets.reduce((s, x) => s + x.pids.length, 0);
  G.stage = 'prep';
  return G;
}

function buildSets(G) {
  const pool = G.pool.map(id => G.players[id]), sets = [], used = new Set();
  let marquee;
  if (G.mode === 'real') {
    const byName = Object.fromEntries(pool.map(p => [p.name, p]));
    marquee = MARQUEE_REAL.map(l => l.map(n => byName[n]).filter(Boolean));
  } else {
    const top = pool.filter(p => p.capped).sort((a, b) => b.ovr - a.ovr).slice(0, 12);
    marquee = [top.slice(0, 6), top.slice(6, 12)];
  }
  marquee.forEach((m, i) => { if (m.length) { sets.push({ code: 'M' + (i + 1), name: 'Marquee Set ' + (i + 1), pids: shuffle(m.map(p => p.id)) }); m.forEach(p => used.add(p.id)); } });
  const rest = pool.filter(p => !used.has(p.id));
  const roles = [['BA', 'Batters'], ['AR', 'All-rounders'], ['WK', 'Wicketkeepers'], ['FA', 'Fast bowlers'], ['SP', 'Spinners']];
  const byRole = {};
  roles.forEach(([r]) => { byRole[r] = chunk(rest.filter(p => p.capped && p.role === r).sort((a, b) => b.ovr - a.ovr), 10); });
  const unc = chunk(rest.filter(p => !p.capped).sort((a, b) => b.ovr - a.ovr), 10);
  const rounds = Math.max(unc.length, ...roles.map(([r]) => byRole[r].length));
  for (let i = 0; i < rounds; i++) {
    roles.forEach(([r, label]) => { const c = byRole[r][i]; if (c) sets.push({ code: r + (i + 1), name: label + ' · Set ' + (i + 1), pids: shuffle(c.map(p => p.id)) }); });
    if (unc[i]) sets.push({ code: 'UC' + (i + 1), name: 'Uncapped · Set ' + (i + 1), pids: shuffle(unc[i].map(p => p.id)) });
  }
  sets.forEach((s, i) => { s.idx = i; });
  return sets;
}

/* ---------- auction ---------- */
function place(G, H, t, price) {
  const c = G.cur;
  c.price = price; c.leader = t; c.idle = 0; c.hist.push({ t, price });
  return H.bid(t, price);
}

function userBid(G, H) {
  const c = G.cur;
  if (!c || c.phase !== 'bidding') return { ok: false, msg: 'Bidding is not open right now' };
  if (c.leader === G.user) return { ok: false, msg: 'You already hold the highest bid' };
  const p = G.players[c.pid], next = nextPrice(c, p), why = whyNot(G, G.user, p, next);
  if (why) return { ok: false, msg: why };
  place(G, H, G.user, next);
  return { ok: true };
}

function purchase(G, t, p, price, how) {
  const T = G.teams[t];
  T.purse -= price; T.squad.push({ pid: p.id, price, how }); p.owner = t; p.soldPrice = price;
  G.sold.push({ pid: p.id, team: t, price, how });
}

async function rtmFlow(G, H, p, winner, price) {
  const r = p.rtmTeam;
  if (G.mode === 'mini' || !r || r === winner) return { w: winner, pr: price, rtm: false };
  const RT = G.teams[r];
  if (RT.rtm <= 0 || !canBid(G, r, p, price)) return { w: winner, pr: price, rtm: false };
  const aiInterest = () => G.interest[r] != null ? G.interest[r] : maxBid(G, r, p);
  const wants = r === G.user ? await H.rtmAsk(p, winner, price) : aiInterest() >= price;
  if (!wants) return { w: winner, pr: price, rtm: false };
  await H.rtmNote(r, p, price);
  let np = price;
  if (winner === G.user) {
    np = await H.rtmRaise(p, r, price);
  } else {
    const mx = G.interest[winner] != null ? G.interest[winner] : 0;
    if (mx >= price + inc(price) && Math.random() < 0.6) {
      const steps = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < steps; i++) { const n2 = np + inc(np); if (n2 <= mx && canBid(G, winner, p, n2)) np = n2; else break; }
    }
  }
  if (np > price) {
    await H.rtmRaised(winner, p, np);
    const match = canBid(G, r, p, np) && (r === G.user ? await H.rtmMatch(p, winner, np) : aiInterest() >= np);
    if (!match) return { w: winner, pr: np, rtm: false };
  }
  RT.rtm--;
  return { w: r, pr: np, rtm: true };
}

async function lot(G, H, pid) {
  const p = G.players[pid];
  G.lotNo++;
  G.cur = { pid, price: 0, leader: null, hist: [], idle: 0, phase: 'bidding' };
  G.interest = {};
  TEAMS.forEach(t => { if (t.id !== G.user) G.interest[t.id] = maxBid(G, t.id, p); });
  await H.lotStart(p);
  const c = G.cur;
  for (;;) {
    await H.wait(c.hist.length ? H.gap.bid : H.gap.open);
    const next = nextPrice(c, p), wl = G.wishlist[pid];
    if (G.auto && wl && c.leader !== G.user && next <= wl.max && canBid(G, G.user, p, next)) { await place(G, H, G.user, next); continue; }
    const cands = TEAMS.map(t => t.id).filter(id => id !== G.user && id !== c.leader && G.interest[id] >= next && canBid(G, id, p, next));
    if (cands.length) { await place(G, H, cands[Math.floor(Math.random() * cands.length)], next); continue; }
    c.idle++;
    if (!c.leader) { if (c.idle >= 2) break; continue; }
    if (c.idle >= 3) break;
    await H.going(c.idle);
  }
  c.phase = 'resolving';
  if (!c.leader) { G.unsold.push(pid); await H.unsold(p); return; }
  const res = await rtmFlow(G, H, p, c.leader, c.price);
  purchase(G, res.w, p, res.pr, res.rtm ? 'RTM' : 'AUC');
  await H.sold(res.w, p, res.pr, res.rtm);
}

function genPlayer(G, role) {
  const id = G.players.length, k = G.filled.length + 1;
  const p = { id, name: 'Domestic Prospect ' + k, role, nat: 'IN', os: false, capped: false, base: MIN_BASE, team25: null, price25: 0, ovr: 50, prev: null, ret: false, owner: null, soldPrice: 0, rtmTeam: null, gen: true };
  G.players.push(p);
  return p;
}

async function run(G, H) {
  G.stage = 'auction';
  for (const s of G.sets) {
    await H.setStart(s);
    for (const pid of s.pids) await lot(G, H, pid);
  }
  const again = G.unsold.filter(id => G.players[id].ovr >= 55).sort((a, b) => G.players[b].ovr - G.players[a].ovr);
  if (again.length) {
    G.accel = true; G.unsold = G.unsold.filter(id => !again.includes(id));
    const s = { code: 'ACC', name: 'Accelerated · Unsold players', pids: again, idx: G.sets.length };
    G.sets.push(s); await H.setStart(s);
    for (const pid of again) await lot(G, H, pid);
  }
  const roleCycle = ['BA', 'FA', 'AR', 'WK', 'SP'];
  for (const t of TEAMS) {
    const T = G.teams[t.id];
    while (T.squad.length < MIN_SQ && T.purse >= MIN_BASE) {
      const p = genPlayer(G, roleCycle[T.squad.length % 5]);
      purchase(G, t.id, p, MIN_BASE, 'FILL'); G.filled.push({ team: t.id, pid: p.id });
    }
  }
  G.stage = 'done';
  await H.end();
}

function teamRating(G, t) {
  const ps = G.teams[t].squad.map(e => G.players[e.pid]).sort((a, b) => b.ovr - a.ovr);
  const xi = []; let os = 0;
  for (const p of ps) { if (xi.length >= 11) break; if (p.os) { if (os >= 4) continue; os++; } xi.push(p); }
  return xi.length ? xi.reduce((s, p) => s + p.ovr, 0) / xi.length : 0;
}

function speak(text, max = 3200) {
  return new Promise(res => {
    if (!UI.voice || !SYN || UI.ff || UI.speed === 'turbo' || UI.paused) return res();
    try {
      SYN.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = VOICES.find(x => x.name === UI.voiceName) || VOICES.find(x => x.lang === 'en-IN') || VOICES[0];
      if (v) u.voice = v;
      u.rate = UI.speed === 'fast' ? 1.25 : 1.02;
      let done = false; const fin = () => { if (!done) { done = true; res(); } };
      u.onend = fin; u.onerror = fin; setTimeout(fin, max); SYN.speak(u);
    } catch (e) { res(); }
  });
}

  },

    const v = await ask(`<h2>Right to Match</h2><p><b>${esc(p.name)}</b> was going to <b>${esc(TM[w].name)}</b> at <b>${fmt(pr)}</b>. You hold the RTM rights for this player.</p>
      <div class="stat"><span>RTM cards left</span><b>${r.rtm}</b></div><div class="stat"><span>Purse</span><b>${fmt(r.purse)}</b></div>
      <div class="row"><button class="btn gold" data-ans="y">Use RTM at ${fmt(pr)}</button><button class="btn" data-ans="n">Let him go</button></div>`);
    return v === 'y';
  },
  async rtmNote(r, p, pr) { toast(`${TM[r].name} use the Right to Match on ${p.name}`); await speak(`${TM[r].name} use the right to match.`, 3000); await H.wait(600); },
  async rtmRaise(p, r, pr) {
    const next = pr + inc(pr);
    if (!canBid(G, G.user, p, next)) { toast('You cannot afford to raise the bid.'); return pr; }
    let np = pr;
    const draw = () => `<h2>${esc(TM[r].name)} have used RTM</h2><p>They will match <b>${fmt(pr)}</b> for ${esc(p.name)}. You may raise the price once. They then decide whether to match it.</p>
      <div class="stepper"><button class="btn" data-ans="dn" ${np <= pr ? 'disabled' : ''}>−</button><div class="big">${fmt(np)}</div><button class="btn" data-ans="up" ${canBid(G, G.user, p, np + inc(np)) ? '' : 'disabled'}>+</button></div>
      <div class="row"><button class="btn gold" data-ans="ok">${np > pr ? 'Raise to ' + fmt(np) : 'Hold at ' + fmt(pr)}</button></div>`;
    for (;;) {
      const v = await ask(draw());
      if (v === 'up') np += inc(np); else if (v === 'dn') { let q = pr; while (q + inc(q) < np) q += inc(q); np = q; } else return np;
    }
  },
  async rtmRaised(w, p, np) { renderBoard(true); toast(`${TM[w].name} raise to ${fmt(np)}`); await speak(`${TM[w].name} raise the bid to ${say(np)}.`, 3500); },
  async rtmMatch(p, w, np) {
    const v = await ask(`<h2>Match the raised bid?</h2><p>${esc(TM[w].name)} raised the price for <b>${esc(p.name)}</b> to <b>${fmt(np)}</b>. If you decline, your RTM card is kept.</p>
      <div class="row"><button class="btn gold" data-ans="y">Match ${fmt(np)}</button><button class="btn" data-ans="n">Decline</button></div>`);
    return v === 'y';
  },
  async end() { UI.started = false; go('done'); },
};

/* ---------- results ---------- */
function renderDone() {
  const ranks = TEAMS.map(t => ({ id: t.id, r: teamRating(G, t.id), I: info(G, t.id), spent: PURSE - G.teams[t.id].purse })).sort((a, b) => b.r - a.r);
  const me = ranks.findIndex(x => x.id === G.user) + 1;
  const top = [...G.sold].sort((a, b) => b.price - a.price).slice(0, 8);
  SCREEN.innerHTML = `<section class="sec"><h1 style="font-size:clamp(34px,6vw,64px)">Auction complete</h1>
    <p class="mute" style="margin:0">${TM[G.user].name} finish <b style="color:var(--gold)">#${me}</b> of 10 on best-XI rating.${G.filled.length ? ` ${G.filled.length} placeholder prospects were added at ₹30 L to bring short squads up to 19.` : ''}</p>
    <div class="two"><div class="card scroll-x"><h3>Standings</h3><table class="tbl"><thead><tr><th>#</th><th>Team</th><th>Best XI</th><th>Squad</th><th>OS</th><th>Spent</th><th>Purse left</th></tr></thead><tbody>
      ${ranks.map((x, i) => `<tr style="${x.id === G.user ? 'background:#2a2210' : ''}"><td>${i + 1}</td><td><span class="row">${crest(x.id, 22)} ${x.id}</span></td><td><b>${x.r.toFixed(1)}</b></td><td>${x.I.n}</td><td>${x.I.os}</td><td>${fmt(x.spent)}</td><td>${fmt(G.teams[x.id].purse)}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h3>Biggest buys</h3>${top.map(s => prow(G.players[s.pid], `${crest(s.team, 20)}<b>${fmt(s.price)}</b>`)).join('')}</div></div>
    <h3>Squads</h3><div id="doneSquads">${TEAMS.map(t => `<details class="set" ${t.id === G.user ? 'open' : ''}><summary>${crest(t.id, 26)} ${t.name} <small>${fmt(G.teams[t.id].purse)} left</small></summary><div style="padding:8px">${squadHTML(t.id)}</div></details>`).join('')}</div>
    <div class="cta"><button class="btn gold" data-act="again">Play again</button></div></section>`;
}

/* ---------- events ---------- */
function rerenderPrepOrSide() { if (UI.screen === 'prep') updPrep(); else renderSide(); }
document.addEventListener('click', e => {
  const ans = e.target.closest('[data-ans]'); if (ans) { answer(ans.dataset.ans); return; }
  if (e.target === MODAL && !UI.modalRes) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const a = el.dataset.act, id = +el.dataset.id;
  switch (a) {
    case 'mode': UI.mode = el.dataset.v; renderHome(); break;
    case 'team': UI.team = el.dataset.v; renderHome(); break;
    case 'start':
      if (UI.mode === 'custom') { UI.custom = []; go('custom'); }
      else { G = newGame(UI.mode, UI.team); UI.selRet = UI.mode === 'mini' ? [...G.rosters[UI.team]] : []; UI.started = false; go('retention'); }
      break;
    case 'home': go('home'); break;
    case 'cpick': { const i = UI.custom.indexOf(id); if (i >= 0) UI.custom.splice(i, 1); else if (UI.custom.length < 25) UI.custom.push(id); else toast('Squad is full (25).'); updCustom(); break; }
    case 'customdone': G = newGame('custom', UI.team, UI.custom); UI.selRet = []; UI.started = false; go('retention'); break;
    case 'retpick': { const i = UI.selRet.indexOf(id); if (i >= 0) UI.selRet.splice(i, 1); else UI.selRet.push(id); updRet(); break; }
    case 'retdone': finalizeRetention(G, UI.selRet); go('reveal'); break;
    case 'toprep': go('prep'); break;
    case 'wl': wlToggle(id); rerenderPrepOrSide(); if (UI.screen === 'auction') updateBid(); break;
    case 'startauction': UI.paused = false; go('auction'); break;
    case 'bid': { if (UI.paused) break; const r = userBid(G, H); if (!r.ok) toast(r.msg); break; }
    case 'pause': UI.paused = !UI.paused; if (UI.paused && SYN) { try { SYN.cancel(); } catch (x) { /* ignore */ } } $('#pauseBtn').textContent = UI.paused ? 'Resume' : 'Pause'; $('#hud').classList.toggle('paused', UI.paused); $('#liveTag').textContent = UI.paused ? 'PAUSED' : 'LIVE'; $('#pmask').hidden = !UI.paused; updateBid(); break;
    case 'ff': {
      if (UI.ff) { UI.ff = false; el.textContent = 'Skip to wishlist'; updateBid(); break; }
      const upcoming = G.sets.some(s => s.pids.some(pid => G.wishlist[pid] && !G.sold.some(x => x.pid === pid) && !G.unsold.includes(pid) && (!G.cur || pid !== G.cur.pid)));
      if (!upcoming) { toast('No wishlist players left to wait for. Add some with the star first.'); break; }
      UI.ff = true; el.textContent = 'Stop skipping'; toast('Skipping ahead to your next wishlist player…'); updateBid(); break;
    }
    case 'tab': UI.tab = el.dataset.v; renderSide(); break;
    case 'team-view': openModal(squadHTML(el.dataset.t) + '<div class="row"><button class="btn" data-ans="x">Close</button></div>', true); UI.modalRes = null; break;
    case 'quit': ask('<h2>Leave the auction?</h2><p>This ends the current auction and your progress is lost.</p><div class="row"><button class="btn danger" data-ans="y">Leave</button><button class="btn" data-ans="n">Keep playing</button></div>').then(v => { if (v === 'y') location.reload(); }); break;
    case 'again': location.reload(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'), t = e.target;
  if (t.id === 'cq' || t.id === 'crole') { UI.cq = $('#cq').value; UI.crole = $('#crole').value; updCustom(); return; }
  if (t.id === 'pq' || t.id === 'prole' || t.id === 'pwish') { UI.q = $('#pq').value; UI.role = $('#prole').value; UI.onlyWish = $('#pwish').checked; updPrep(); return; }
  if (t.id === 'autobid') { G.auto = t.checked; return; }
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'wlmax') {
    const p = G.players[+el.dataset.id]; let v = Math.round(parseFloat(el.value) * 100 / 5) * 5;
    if (!(v >= p.base)) v = p.base; G.wishlist[p.id].max = v; el.value = v / 100;
    if (UI.screen === 'prep') $('#wishbox').innerHTML = wishHTML(false); else renderSide();
  } else if (a === 'speed') { UI.speed = el.value; try { SYN && SYN.cancel(); } catch (x) { /* ignore */ } }
  else if (a === 'voice') { UI.voice = el.checked; if (!UI.voice && SYN) { try { SYN.cancel(); } catch (x) { /* ignore */ } } }
  else if (a === 'voicesel') { UI.voiceName = el.value; speak('Welcome to the IPL auction.'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cq') { UI.cq = t.value; updCustom(); }
  else if (t.id === 'pq') { UI.q = t.value; updPrep(); }
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && UI.screen === 'auction' && MODAL.hidden && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); const b = $('#bidBtn'); if (b && !b.disabled) b.click(); }
  if (e.key === 'Escape' && !UI.modalRes && !MODAL.hidden) closeModal();
});
document.addEventListener('toggle', e => {
  const d = e.target; if (d.tagName !== 'DETAILS' || !d.dataset.set) return;
  const i = +d.dataset.set; if (d.open) UI.openSets.add(i); else UI.openSets.delete(i);
}, true);

go('home');

</script>
</body></html>
